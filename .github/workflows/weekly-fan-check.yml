# .github/workflows/weekly-fan-check.yml に置く
name: weekly-fan-check

on:
  schedule:
    - cron: "0 1 * * 1"   # 毎週月曜 10:00 JST（UTC 01:00）
  workflow_dispatch:       # 手動実行ボタン

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install discord.py
      - run: python fan_check.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          REPORT_CHANNEL_ID: ${{ secrets.REPORT_CHANNEL_ID }}
          SUB_ROLE_IDS: ${{ secrets.SUB_ROLE_IDS }}
          EXEMPT_ROLE_IDS: ${{ secrets.EXEMPT_ROLE_IDS }}
          GRACE_DAYS: "3"
          KICK_LAPSED: "false"   # 慣れたら true にすると自動キック
